# device to fabric mapping
"xc7a200t":
  fabric: "xc7a200t"
"xc7a100t":
  fabric: "xc7a100t"
"xc7a50t":
  fabric: "xc7a50t"
"xc7a35t":
  fabric: "xc7a50t"
# The xc7a12t and xc7a25t share one die; the 12t is capacity-capped in
# software only (Vivado reports the full grid for it: 3650 slices,
# 45 BRAM36, 80 DSP48, but BLOCK_RAMS=20 limits synthesis).  The fabric
# is fuzzed on the uncapped xc7a25t part and shared by both devices.
"xc7a25t":
  fabric: "xc7a12t"
"xc7a12t":
  fabric: "xc7a12t"
